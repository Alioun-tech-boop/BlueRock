# =====================================================================
# nginx — edge BlueRock : TLS, gzip, cache fil communautaire, LB API
# Le cache du fil (/api/community/posts) repose sur le Cache-Control
# "public" émis par l'API pour les flux anonymes.
# =====================================================================
worker_processes auto;
events { worker_connections 4096; }

http {
    # ---- Cache partagé pour le fil communautaire cachable ----
    proxy_cache_path /var/cache/nginx/feed levels=1:2 keys_zone=feed_cache:50m
                     inactive=60s max_size=1g use_temp_path=off;

    upstream api_backend {
        least_conn;                 # répartit sur les replicas API (compose --scale api=N)
        server api:8000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    # Trusted proxies : IPs du réseau compose + CDN en prod (Cloudflare etc.)
    # Nécessaire pour que X-Forwarded-For soit interprété (TRUST_PROXY_IPS).
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;

    client_max_body_size 25m;       # uploads médias communauté
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    server {
        listen 80;
        server_name _;
        # En prod : redirect 301 -> https (certbot/cloudflare).
        location /api/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cache edge uniquement pour le fil public (Cache-Control: public)
            proxy_cache feed_cache;
            proxy_cache_valid 200 15s;        # aligné sur s-maxage API
            proxy_cache_use_stale updating error timeout http_500 http_502 http_503;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Builds statiques Next.js (frontend/admin) servis par nginx
        # avec Cache-Control long — c'est le principal bénéfice CDN.
        location /_next/static/ {
            proxy_pass http://api_backend;     # ou bucket statique en prod
            expires max;
            add_header Cache-Control "public, immutable, max-age=31536000";
        }

        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # En prod, bloc server 443 avec ssl_certificate / ssl_certificate_key
    # + HSTS + OCSP stapling. Voir deploy/INFRA.md.
}
