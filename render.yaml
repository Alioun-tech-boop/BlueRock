services:
  - type: web
    name: bluerock-api
    runtime: docker
    repo: https://github.com/Alioun-tech-boop/BlueRock
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: BRVM_BASE_URL
        value: https://www.brvm.org
      - key: DEBUG
        value: "false"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1,.bluerock.ai,.netlify.app"
      # Le scheduler tourne dans le web (mono-instance free) ; le verrou
      # distribué SharedStore évite la double-exécution si on scale.
      - key: WORKER_JOBS
        value: "1"
      - key: TRUST_PROXY_IPS
        value: "*"
      # Secrets — définis manuellement dans le dashboard (jamais commités)
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: REDIS_URL
        sync: false
