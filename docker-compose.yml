services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bluerock
      POSTGRES_PASSWORD: bluerock123
      POSTGRES_DB: bluerock
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluerock"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://bluerock:bluerock123@postgres:5432/bluerock
      DEBUG: ${DEBUG:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      SECRET_KEY: ${SECRET_KEY:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,.bluerock.ai}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
